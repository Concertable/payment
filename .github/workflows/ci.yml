name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_READ || secrets.GITHUB_TOKEN }}
  DOTNET_NOLOGO: true

jobs:
  build-test-pack:
    name: Build, unit test, and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan source for secrets
        run: >-
          docker run --rm
          --volume '${{ github.workspace }}:/work:ro'
          --volume '${{ runner.temp }}/trivy-cache:/root/.cache/trivy'
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          filesystem --scanners secret --exit-code 1 --no-progress --timeout 30m /work
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore repository-local solution
        run: dotnet restore Concertable.Payment.slnx
      - name: Build repository-local solution
        run: dotnet build Concertable.Payment.slnx --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test api/tests/Concertable.Payment.UnitTests/Concertable.Payment.UnitTests.csproj --configuration Release --no-restore
      - name: Run architecture tests
        run: dotnet test api/tests/Concertable.Payment.ArchitectureTests/Concertable.Payment.ArchitectureTests.csproj --configuration Release --no-restore
      - name: Run startup and composition tests
        run: dotnet test api/tests/Concertable.Payment.StartupTests/Concertable.Payment.StartupTests.csproj --configuration Release --no-restore
      - name: Run E2E admin surface tests
        run: dotnet test api/tests/Concertable.Payment.E2EAdmin.IntegrationTests/Concertable.Payment.E2EAdmin.IntegrationTests.csproj --configuration Release --no-restore
      - name: Pack Payment-owned packages
        run: |
          dotnet pack api/src/Concertable.Payment.Contracts/Concertable.Payment.Contracts.csproj --configuration Release --output artifacts/packages
          dotnet pack api/src/Concertable.Payment.Client/Concertable.Payment.Client.csproj --configuration Release --output artifacts/packages
          dotnet pack api/src/Concertable.Payment.Hosting/Concertable.Payment.Hosting.csproj --configuration Release --output artifacts/packages
          dotnet pack api/src/Concertable.Payment.TestKit/Concertable.Payment.TestKit.csproj --configuration Release --output artifacts/packages

  images:
    name: Build and scan images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer needs the history to compute the height the publish will use.
          fetch-depth: 0
      # Before the expensive part: a gate that throws on a clean report also "blocks", and in a log that
      # is indistinguishable from one that caught something.
      - name: Test the Trivy result gate
        run: pwsh -NoProfile -File ./scripts/test-trivy-gate.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # A cold Trivy re-downloads its database and re-analyses every layer; measured locally at 10m30s
      # and a deadline against ~100s warm.
      - name: Restore the Trivy cache
        uses: actions/cache@v4
        with:
          path: artifacts/trivy-cache
          key: trivy-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: trivy-cache-${{ runner.os }}-
      - name: Build, scan, and inventory the Payment images
        # A separate process, not `&`: this workflow's shell does not leak its strict-mode setting into
        # a script written against the lenient default.
        run: pwsh -NoProfile -File ./scripts/verify-payment-images.ps1
      - name: Retain the image scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-image-evidence
          path: |
            artifacts/evidence
            artifacts/images/payment-images.json
          if-no-files-found: error

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore integration tests
        run: dotnet restore api/tests/Concertable.Payment.IntegrationTests/Concertable.Payment.IntegrationTests.csproj
      - name: Run Docker-backed integration tests
        run: dotnet test api/tests/Concertable.Payment.IntegrationTests/Concertable.Payment.IntegrationTests.csproj --configuration Release --no-restore

  ci-complete:
    name: ci-complete
    if: ${{ always() }}
    needs:
      - build-test-pack
      - images
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: Concertable/pipeline/.github/actions/require-jobs-green@3b4313ef1130400b2b35f7b3b3f5f57c22b23d82
        with:
          results: ${{ join(needs.*.result, " ") }}
