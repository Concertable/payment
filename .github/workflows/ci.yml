name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOTNET_NOLOGO: true

jobs:
  build-test-pack:
    name: Build, unit test, and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore deployable and package closures
        run: |
          dotnet restore src/Concertable.Payment.Web/Concertable.Payment.Web.csproj
          dotnet restore src/Concertable.Payment.Workers/Concertable.Payment.Workers.csproj
          dotnet restore tests/Concertable.Payment.UnitTests/Concertable.Payment.UnitTests.csproj
          dotnet restore src/Concertable.Payment.Hosting/Concertable.Payment.Hosting.csproj
      - name: Build deployable closures
        run: |
          dotnet build src/Concertable.Payment.Web/Concertable.Payment.Web.csproj --configuration Release --no-restore
          dotnet build src/Concertable.Payment.Workers/Concertable.Payment.Workers.csproj --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test tests/Concertable.Payment.UnitTests/Concertable.Payment.UnitTests.csproj --configuration Release --no-restore
      - name: Pack Payment-owned packages
        run: |
          dotnet pack src/Concertable.Payment.Contracts/Concertable.Payment.Contracts.csproj --configuration Release --output artifacts/packages
          dotnet pack src/Concertable.Payment.Client/Concertable.Payment.Client.csproj --configuration Release --output artifacts/packages
          dotnet pack src/Concertable.Payment.Hosting/Concertable.Payment.Hosting.csproj --configuration Release --output artifacts/packages
          test "$(find artifacts/packages -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 3

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore integration tests
        run: dotnet restore tests/Concertable.Payment.IntegrationTests/Concertable.Payment.IntegrationTests.csproj
      - name: Run Docker-backed integration tests
        run: dotnet test tests/Concertable.Payment.IntegrationTests/Concertable.Payment.IntegrationTests.csproj --configuration Release --no-restore

  ci-complete:
    name: CI complete
    if: ${{ always() }}
    needs:
      - build-test-pack
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Payment checks
        env:
          BUILD_TEST_PACK_RESULT: ${{ needs.build-test-pack.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
        run: |
          test "$BUILD_TEST_PACK_RESULT" = "success"
          test "$INTEGRATION_TESTS_RESULT" = "success"
